<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="medicalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0083B0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8E8E;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="90" fill="url(#medicalGradient)" filter="url(#shadow)"/>
  
  <!-- 医疗十字 -->
  <g transform="translate(100, 100)">
    <!-- 垂直线 -->
    <rect x="-8" y="-35" width="16" height="70" rx="8" fill="white"/>
    <!-- 水平线 -->
    <rect x="-35" y="-8" width="70" height="16" rx="8" fill="white"/>
  </g>
  
  <!-- 连接符号（代表邻里连接） -->
  <g transform="translate(100, 100)">
    <!-- 上方连接线 -->
    <path d="M -30 -50 Q 0 -70 30 -50" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 下方连接线 -->
    <path d="M -30 50 Q 0 70 30 50" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 左侧连接线 -->
    <path d="M -50 -30 Q -70 0 -50 30" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 右侧连接线 -->
    <path d="M 50 -30 Q 70 0 50 30" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- 爱心符号（代表医疗关怀） -->
  <g transform="translate(100, 100) scale(0.4)">
    <path d="M -25 -10 C -25 -25 -10 -25 0 -15 C 10 -25 25 -25 25 -10 C 25 10 0 25 0 25 C 0 25 -25 10 -25 -10 Z" fill="url(#heartGradient)"/>
  </g>
  
  <!-- 外圈装饰 -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="white" stroke-width="3" opacity="0.3"/>
</svg>